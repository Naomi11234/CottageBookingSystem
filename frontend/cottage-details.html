<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרטי צימר ולוח הזמנות - נופש בקליק</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-card-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: var(--shadow-subtle);
        }
        @media (max-width: 900px) {
            .booking-card-wrapper { grid-template-columns: 1fr; }
        }
        
        /* עיצוב לוח השנה המודרני */
        .calendar-container {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 10px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendar-header h4 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        .nav-month-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .nav-month-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }
        .day-name {
            font-weight: bold;
            color: var(--primary-color);
            padding-bottom: 8px;
            font-size: 0.9rem;
        }
        .day-btn {
            padding: 10px 4px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .day-btn.empty {
            visibility: hidden;
        }
        .day-btn.available:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .day-btn.selected {
            background: var(--accent-color) !important;
            color: white !important;
            border-color: var(--accent-color) !important;
            font-weight: bold;
        }
        .day-btn.booked {
            background: #fee2e2;
            color: #ef4444;
            border-color: #fca5a5;
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: 0.75;
        }
        
        .form-field-group {
            margin-top: 15px;
        }
        .form-field-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary-color);
        }
        .form-field-group select, .form-field-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
        }
        .form-field-group select:focus, .form-field-group textarea:focus {
            border-color: var(--primary-color);
            background: white;
        }
    </style>
</head>
<body>

    <nav class="top-nav" style="background: var(--primary-color); position: relative; padding: 20px 40px;">
        <a href="index.html" class="logo">🌲 נופש בקליק</a>
        <div class="nav-links">
            <a href="index.html">← חזרה לכל הצימרים</a>
        </div>
    </nav>

    <main class="container" style="margin-top: 40px; margin-bottom: 60px;">
        <div id="cottage-details-container">
            <!-- נטען דינמית -->
        </div>
    </main>

    <footer>
        <p>© 2026 נופש בקליק - מערכת לניהול והזמנת צימרים יוקרתית</p>
    </footer>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        let currentDate = new Date();
        let selectedDateStr = null;
        let cottageId = null;
        let bookedDatesSet = new Set();

        const monthNamesHebrew = [
            "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
            "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            cottageId = Number(urlParams.get('id'));

            // טעינת הצימרים מהשרת או מהגיבוי המקומי
            let cottages = [];
            try {
                cottages = await apiRequest('/cottages');
            } catch (e) {
                cottages = JSON.parse(localStorage.getItem('localCottages') || '[]');
            }

            const cottage = cottages.find(c => c.id === cottageId);
            const container = document.getElementById('cottage-details-container');

            if (!cottage) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; background: white; border-radius: 20px;">
                        <h2>הצימר המבוקש לא נמצא במערכת</h2>
                        <a href="index.html" class="book-btn" style="display:inline-block; margin-top:20px; text-decoration:none;">חזרה לדף הבית</a>
                    </div>
                `;
                return;
            }

            // שליפת כל ההזמנות הקיימות (מ-localStorage או מהשרת)
            let allBookings = [];
            try {
                allBookings = JSON.parse(localStorage.getItem('localBookings') || '[]');
            } catch (err) {
                allBookings = [];
            }
            
            const cottageBookings = allBookings.filter(b => b.cottageId === cottageId);
            bookedDatesSet = new Set(cottageBookings.map(b => b.date));

            let maxGuests = cottage.maxGuests || 4;
            let guestsOptionsHtml = '';
            for (let i = 1; i <= maxGuests; i++) {
                guestsOptionsHtml += `<option value="${i}">${i} ${i === 1 ? 'אורח' : 'אורחים'}</option>`;
            }

            container.innerHTML = `
                <div class="booking-card-wrapper">
                    <div>
                        <img src="${cottage.image || 'https://images.unsplash.com/photo-1542718610-a1d656d1884c?auto=format&fit=crop&w=1000&q=80'}" alt="${cottage.name}" style="width: 100%; height: 350px; object-fit: cover; border-radius: 16px;">
                        <div style="margin-top: 20px;">
                            <span style="background: #f1f5f9; color: #334155; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 500;">📍 ${cottage.location}</span>
                            <h1 style="color: var(--primary-color); margin: 15px 0 10px 0; font-size: 2.2rem;">${cottage.name}</h1>
                            <p style="font-size: 1.3rem; color: var(--accent-color); font-weight: bold;">₪${cottage.pricePerNight} <span style="font-size: 0.9rem; font-weight: normal; color: #666;">/ לילה</span></p>
                            <p style="color: #64748b; font-size: 1rem; line-height: 1.6;">בקתה כפרית מרהיבה ביופייה לחופשת רוגע אינסופי בטבע.</p>
                            <p style="font-size: 1rem; color: #334155;">👥 <strong>תפוסה מקסימלית:</strong> עד ${maxGuests} אורחים</p>
                        </div>
                    </div>

                    <div>
                        <h3 style="color: var(--primary-color); margin-top: 0;">📅 בחירת תאריך ופרטי ההזמנה</h3>
                        
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <button class="nav-month-btn" onclick="changeMonth(-1)">❮ חודש קודם</button>
                                <h4 id="calendar-month-year"></h4>
                                <button class="nav-month-btn" onclick="changeMonth(1)">חודש הבא ❯</button>
                            </div>
                            <div class="calendar-grid" id="calendar-days">
                                <!-- הימים ייטענו דינמית -->
                            </div>
                        </div>

                        <div class="form-field-group">
                            <label for="guests-count-select">👥 מספר אורחים בפועל (עד ${maxGuests}):</label>
                            <select id="guests-count-select">
                                ${guestsOptionsHtml}
                            </select>
                        </div>

                        <div class="form-field-group">
                            <label for="special-notes">📝 הערות ובקשות מיוחדות לבעל הצימר:</label>
                            <textarea id="special-notes" rows="3" placeholder="למשל: נשמח להפרדת מיטות, הגעה מאוחרת..."></textarea>
                        </div>

                        <div style="margin-top: 25px;">
                            <p id="selected-date-display" style="font-weight: 600; color: var(--primary-color);">טרם נבחר תאריך לחופשה</p>
                            <button id="submit-booking-btn" class="book-btn" onclick="confirmBooking(${cottage.id}, '${cottage.name}', ${cottage.pricePerNight})" style="width: 100%; padding: 14px; font-size: 1.1rem; opacity: 0.5; cursor: not-allowed;" disabled>אישור ושריון ההזמנה</button>
                        </div>
                    </div>
                </div>
            `;

            renderCalendar();
        });

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendar-month-year').innerText = `${monthNamesHebrew[month]} ${year}`;

            const calendarGrid = document.getElementById('calendar-days');
            calendarGrid.innerHTML = '';

            const daysOfWeek = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
            daysOfWeek.forEach(day => {
                calendarGrid.innerHTML += `<div class="day-name">${day}</div>`;
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                calendarGrid.innerHTML += `<div class="day-btn empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const formattedDateStr = `${day.toString().padStart(2, '0')}/${(month + 1).toString().padStart(2, '0')}/${year}`;
                const isBooked = bookedDatesSet.has(formattedDateStr);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = day;

                if (isBooked) {
                    btn.className = 'day-btn booked';
                    btn.title = 'תאריך זה כבר תפוס';
                    btn.disabled = true;
                } else {
                    btn.className = 'day-btn available';
                    if (selectedDateStr === formattedDateStr) {
                        btn.classList.add('selected');
                    }
                    btn.onclick = () => selectDate(btn, formattedDateStr);
                }

                calendarGrid.appendChild(btn);
            }
        }

        function selectDate(buttonElement, dateStr) {
            document.querySelectorAll('.day-btn.available').forEach(b => b.classList.remove('selected'));
            buttonElement.classList.add('selected');
            selectedDateStr = dateStr;

            document.getElementById('selected-date-display').innerText = `תאריך שנבחר: ${dateStr}`;
            
            const submitBtn = document.getElementById('submit-booking-btn');
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
        }

        function confirmBooking(cottageId, cottageName, price) {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                alert('יש להתחבר למערכת כדי לבצע הזמנה!');
                window.location.href = 'login.html';
                return;
            }

            if (!selectedDateStr) {
                alert('אנא בחרי תאריך פנוי מלוח השנה!');
                return;
            }

            const actualGuests = document.getElementById('guests-count-select').value;
            const notes = document.getElementById('special-notes').value.trim();

            let allBookings = [];
            try {
                allBookings = JSON.parse(localStorage.getItem('localBookings') || '[]');
            } catch (err) {
                allBookings = [];
            }

            allBookings.push({
                id: Date.now(),
                userId: currentUser.id || 1,
                userName: currentUser.fullName || 'משתמש',
                cottageId: cottageId,
                cottageName: cottageName,
                price: price,
                date: selectedDateStr,
                guestsCount: actualGuests,
                notes: notes || 'אין הערות מיוחדות'
            });

            localStorage.setItem('localBookings', JSON.stringify(allBookings));
            alert(`🎉 ההזמנה עבור "${cottageName}" לתאריך ${selectedDateStr} בוצעה בהצלחה! התאריך נחסם כעת בלוח השנה.`);
            window.location.href = 'my-bookings.html';
        }
    </script>
</body>
</html>

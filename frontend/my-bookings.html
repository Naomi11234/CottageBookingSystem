<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נופש בקליק - ההזמנות שלי</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="top-nav" style="background: var(--primary-color); position: relative; padding: 20px 40px;">
        <a href="index.html" class="logo">🌲 נופש בקליק</a>
        <div class="nav-links">
            <a href="index.html">← חזרה לדף הבית</a>
        </div>
    </nav>

    <header class="hero-header" style="height: 40vh;">
        <div class="hero-content">
            <h1>ניהול ההזמנות שלי</h1>
            <p>כל חופשות החלום שהזמנת במערכת מרוכזות כאן במקום אחד</p>
        </div>
    </header>

    <main class="container" style="margin-top: -30px; margin-bottom: 80px; position: relative; z-index: 10;">
        <div id="bookings-list" style="display: flex; flex-direction: column; gap: 20px;">
            <!-- ההזמנות יטענו לכאן דינמית -->
        </div>
    </main>

    <footer>
        <p>© 2026 נופש בקליק - מערכת לניהול והזמנת צימרים</p>
    </footer>

    <script src="db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            const currentUser = userJson ? JSON.parse(userJson) : null;
            const container = document.getElementById('bookings-list');

            if (!container) return;

            if (!currentUser) {
                alert('יש להתחבר למערכת כדי לצפות בהזמנות!');
                window.location.href = 'login.html';
                return;
            }

            let allBookings = [];
            try {
                allBookings = JSON.parse(localStorage.getItem('localBookings') || '[]');
            } catch (err) {
                allBookings = [];
            }

            const userBookings = allBookings.filter(b => String(b.userId) === String(currentUser.id || 1));

            if (userBookings.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; background: white; padding: 60px 30px; border-radius: 20px; box-shadow: var(--shadow-subtle);">
                        <h2 style="color: var(--primary-color); margin-bottom: 15px;">עדיין אין לך הזמנות פעילות</h2>
                        <p style="color: #64748b; margin-bottom: 25px; font-size: 1.1rem;">זה הזמן לבחור צימר מרהיב ולשריין לעצמך חופשה מושלמת!</p>
                        <a href="index.html" class="book-btn" style="display:inline-block; text-decoration:none; padding: 14px 30px;">למעבר למאגר הצימרים</a>
                    </div>
                `;
                return;
            }

            let html = '';
            userBookings.forEach(booking => {
                html += `
                    <div style="background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow-subtle); border: 1px solid #f1f5f9;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
                            <div>
                                <span style="background: #e0f2fe; color: #0369a1; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">הזמנה מאושרת ✔</span>
                                <h3 style="margin: 12px 0 8px 0; color: var(--primary-color); font-size: 1.6rem;">🏠 ${booking.cottageName}</h3>
                                <p style="margin: 0 0 5px 0; color: #64748b; font-size: 1.05rem;">📅 <strong>תאריך חופשה:</strong> ${booking.date}</p>
                                <p style="margin: 0 0 5px 0; color: #64748b; font-size: 1.05rem;">👥 <strong>מספר אורחים:</strong> ${booking.guestsCount || 1} נופשים</p>
                                <p style="margin: 5px 0 0 0; color: #475569; font-size: 0.95rem; background: #f8fafc; padding: 10px 14px; border-radius: 10px; border-right: 4px solid var(--accent-color);">💬 <strong>הערות לבעל הצימר:</strong> ${booking.notes || 'אין'}</p>
                            </div>
                            <div style="text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 15px;">
                                <span style="font-size: 1.4rem; font-weight: bold; color: var(--accent-color);">₪${booking.price || '850'} <span style="font-size:0.85rem; color:#64748b; font-weight:normal;">/ לילה</span></span>
                                <button onclick="cancelBooking(${booking.id})" style="background: #ef4444; color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 500; transition: background 0.2s;">ביטול הזמנה</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        });

        function cancelBooking(bookingId) {
            if (confirm('האם את בטוחה שברצונך לבטל הזמנה זו?')) {
                let allBookings = [];
                try {
                    allBookings = JSON.parse(localStorage.getItem('localBookings') || '[]');
                } catch (err) {
                    allBookings = [];
                }
                allBookings = allBookings.filter(b => b.id !== bookingId);
                localStorage.setItem('localBookings', JSON.stringify(allBookings));
                alert('ההזמנה בוטלה בהצלחה.');
                window.location.reload();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>נופש בקליק - התחברות והרשמה</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container { max-width: 460px; margin: 70px auto; padding: 20px; }
    .auth-box { background: white; padding: 30px; border-radius: 18px; box-shadow: 0 4px 20px #0001; }
    .auth-tabs { display: flex; gap: 10px; margin: 20px 0; }
    .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 9px; }
    .tab-btn.active { background: #1e392a; color: white; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; }
    .feedback { margin: 14px 0; color: #991b1b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-box">
      <h2>🌲 נופש בקליק</h2>
      <div class="auth-tabs">
        <button type="button" id="login-tab" class="tab-btn active">התחברות</button>
        <button type="button" id="register-tab" class="tab-btn">הרשמה</button>
      </div>
      <p id="feedback" class="feedback" role="alert" hidden></p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">אימייל:</label>
          <input type="email" id="login-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="login-password">סיסמה:</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <label><input type="checkbox" id="show-password"> הצג סיסמה</label>
        <button type="submit" class="book-btn" style="width:100%;margin-top:15px">התחבר למערכת</button>
      </form>
      <form id="register-form" hidden>
        <div class="form-group">
          <label for="reg-name">שם מלא:</label>
          <input type="text" id="reg-name" minlength="2" maxlength="150" required>
        </div>
        <div class="form-group">
          <label for="reg-email">אימייל:</label>
          <input type="email" id="reg-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="reg-password">סיסמה:</label>
          <input type="password" id="reg-password" minlength="12" maxlength="128" autocomplete="new-password" required>
          <small>לפחות 12 תווים, אות גדולה, אות קטנה, ספרה וסימן מיוחד.</small>
        </div>
        <button type="submit" class="book-btn" style="width:100%;margin-top:15px">הירשם עכשיו</button>
      </form>
      <p style="text-align:center;margin-top:25px"><a href="index.html">← חזרה לדף הבית</a></p>
    </div>
  </div>
  <script>
    'use strict';
    const API_ROOT = 'https://localhost:7077/api/Auth';
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const feedback = document.getElementById('feedback');
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');

    function setTab(tab) {
      const login = tab === 'login';
      loginForm.hidden = !login;
      registerForm.hidden = login;
      loginTab.classList.toggle('active', login);
      registerTab.classList.toggle('active', !login);
      feedback.hidden = true;
    }
    loginTab.addEventListener('click', () => setTab('login'));
    registerTab.addEventListener('click', () => setTab('register'));
    document.getElementById('show-password').addEventListener('change', event => {
      document.getElementById('login-password').type = event.target.checked ? 'text' : 'password';
    });

    async function authenticate(endpoint, payload, form) {
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      feedback.hidden = true;
      try {
        const response = await fetch(`${API_ROOT}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          if (response.status === 401) throw new Error('האימייל או הסיסמה אינם נכונים.');
          if (response.status === 409) throw new Error('האימייל כבר רשום במערכת.');
          if (response.status === 400) throw new Error('הפרטים אינם תקינים. בדקי את השדות ואת דרישות הסיסמה.');
          throw new Error(`שגיאת שרת (${response.status}).`);
        }
        const data = await response.json();
        if (!data.accessToken || !data.role || !data.userId) {
          throw new Error('השרת החזיר תשובת התחברות לא תקינה.');
        }
        localStorage.setItem('authToken', data.accessToken);
        localStorage.setItem('currentUser', JSON.stringify({
          id: data.userId,
          email: data.email || payload.email,
          fullName: payload.fullName || data.email || payload.email,
          role: data.role
        }));
        window.location.href = data.role.toLowerCase() === 'admin' ? 'admin.html' : 'index.html';
      } catch (error) {
        feedback.textContent = error instanceof TypeError
          ? 'לא ניתן להגיע לשרת. בדקי שהוא פועל בפורט 7077 וש-CORS מאפשר את כתובת האתר.'
          : error.message;
        feedback.hidden = false;
      } finally {
        button.disabled = false;
      }
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();
      authenticate('login', {
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value
      }, loginForm);
    });
    registerForm.addEventListener('submit', event => {
      event.preventDefault();
      authenticate('register', {
        fullName: document.getElementById('reg-name').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value
      }, registerForm);
    });
  </script>
</body>
</html>

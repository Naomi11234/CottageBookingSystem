<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נופש בקליק - התחברות והרשמה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">
            <h2>🌲 נופש בקליק</h2>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">התחברות</button>
                <button class="tab-btn" onclick="switchTab('register')">הרשמה</button>
            </div>

            <!-- טופס התחברות -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>אימייל:</label>
                    <input type="email" id="login-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>סיסמה:</label>
                    <input type="password" id="login-password" required placeholder="הכנס סיסמה">
                    <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px;">
                        <input type="checkbox" id="show-password-checkbox" onclick="togglePasswordVisibility()" style="width: auto; margin: 0;">
                        <label for="show-password-checkbox" style="font-size: 0.9rem; cursor: pointer; margin-bottom: 0; display: inline;">הצג סיסמה</label>
                    </div>
                </div>
                <button type="submit" class="book-btn" style="width:100%; margin-top: 15px;">התחבר למערכת</button>
            </form>

            <!-- טופס הרשמה -->
            <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-group">
                    <label>שם מלא:</label>
                    <input type="text" id="reg-name" required placeholder="ישראל ישראלי">
                </div>
                <div class="form-group">
                    <label>אימייל:</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>סיסמה:</label>
                    <input type="password" id="reg-password" required placeholder="בחר סיסמה">
                </div>
                <button type="submit" class="book-btn" style="width:100%; margin-top: 15px;">הירשם עכשיו</button>
            </form>

            <p style="text-align: center; margin-top: 25px;">
                <a href="index.html" style="color: var(--primary-color); text-decoration:none; font-weight: 500;">← חזרה לדף הבית</a>
            </p>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const btns = document.querySelectorAll('.tab-btn');

            btns.forEach(b => b.classList.remove('active'));
            if (tab === 'login') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                event.target.classList.add('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                event.target.classList.add('active');
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('login-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                // ניסיון התחברות מול השרת בדוט-נט (פורט 7076)
                const response = await fetch('https://localhost:7076/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: data.id || 1,
                        fullName: data.fullName || 'נעמי אבני',
                        email: email,
                        role: data.role || 'Admin'
                    }));
                    if (data.token) {
                        localStorage.setItem('authToken', data.token);
                    }
                    alert(`ברוכה הבאה, ${data.fullName || 'נעמי אבני'}!`);
                    window.location.href = 'index.html';
                } else {
                    // התחברות מנהל מקומית במקרה שהשרת דחה
                    if (email === 'naomi.avni21@gmail.com' && password === 'Naomi216421370') {
                        const adminUser = { id: 1, fullName: 'נעמי אבני', email, role: 'Admin' };
                        localStorage.setItem('currentUser', JSON.stringify(adminUser));
                        alert('התחברת בהצלחה כמנהלת מערכת!');
                        window.location.href = 'index.html';
                        return;
                    }
                    alert('שגיאה: אימייל או סיסמה שגויים.');
                }
            } catch (error) {
                // גיבוי מקומי מלא אם השרת לא זמין
                if (email === 'naomi.avni21@gmail.com' && password === 'Naomi216421370') {
                    const adminUser = { id: 1, fullName: 'נעמי אבני', email, role: 'Admin' };
                    localStorage.setItem('currentUser', JSON.stringify(adminUser));
                    alert('התחברת בהצלחה כמנהלת מערכת (מצב מקומי)!');
                    window.location.href = 'index.html';
                } else {
                    alert('לא ניתן להתחבר לשרת. בדקי שהאפליקציה בדוט-נט רצה.');
                }
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const fullName = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const newUser = {
                id: Date.now(),
                fullName,
                email,
                password,
                role: 'Customer'
            };

            localStorage.setItem('currentUser', JSON.stringify(newUser));
            alert('ההרשמה בוצעה בהצלחה ונכנסת למערכת!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
